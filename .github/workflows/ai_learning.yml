name: AI Self-Learning Brain Updater

on:
  schedule:
    - cron: '0 */6 * * *' # Har 6 ghante baad auto-run hoga
  workflow_dispatch: # Aap manually bhi GitHub se run kar sakte hain

jobs:
  update-memory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas numpy

      - name: Run Learning Update Script
        run: |
          python -c "import json, datetime; data={'last_updated': str(datetime.datetime.now()), 'active_regime': 'SMC_SWEEP', 'strategy_weights': {'SMC_SWEEP': 0.88, 'SMC_FVG': 0.52}}; open('brain_memory.json', 'w').write(json.dumps(data, indent=4))"

      - name: Commit & Push Updated Brain Memory
        run: |
          git config --global user.name "GitHub Action AI Bot"
          git config --global user.email "action@bot.com"
          git add brain_memory.json
          git commit -m "Auto-Update: AI Brain Memory & Win-Rates" || exit 0
          git push
